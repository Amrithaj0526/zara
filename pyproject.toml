[tool.poetry]
name = "zara"
version = "0.1.0"
description = "Zara social media application"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
flask = "^2.3.3"
flask-sqlalchemy = "^3.0.5"
flask-migrate = "^4.0.5"
flask-jwt-extended = "^4.5.2"
flask-cors = "^4.0.0"
python-dotenv = "^1.0.1"
flask-limiter = "^3.5.0"
psycopg2-binary = "^2.9.9"
pillow = "^10.0.1"
gunicorn = "^21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "gunicorn main:app" 