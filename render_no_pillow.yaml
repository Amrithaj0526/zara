services:
  # PostgreSQL Database
  - type: pserv
    name: zara-database
    env: postgresql
    plan: free
    ipAllowList: []

  # Backend API (Without Pillow)
  - type: web
    name: zara-backend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install Flask==2.3.3 Flask-SQLAlchemy==3.0.5 Flask-Migrate==4.0.5 Flask-JWT-Extended==4.5.2 Flask-Cors==4.0.0 python-dotenv==1.0.1 Flask-Limiter==3.5.0 psycopg2-binary==2.9.9 gunicorn==21.2.0
    startCommand: gunicorn main:app
    envVars:
      - key: DATABASE_URL
        fromService:
          name: zara-database
          type: pserv
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FLASK_ENV
        value: production

  # Frontend Static Site
  - type: web
    name: zara-frontend
    env: static
    plan: free
    buildCommand: cd app/frontend && npm install && npm run build
    staticPublishPath: app/frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false 